name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      - run: go test -race ./...
      - run: ./scripts/release.sh "$RELEASE_TAG"
      - run: |
          cd dist
          shasum -a 256 -c checksums.txt
          tar -xzf "hop_${RELEASE_TAG}_linux_amd64.tar.gz"
          ./hop --version
      - run: gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --title "Hop $RELEASE_TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
