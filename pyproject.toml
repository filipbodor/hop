[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-workspaces"
version = "0.1.0"
description = "Open your editor workspaces by name, from any terminal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
dev = "dev_workspaces.cli:main"

[project.urls]
Repository = "https://github.com/filipbodor/dev-workspaces"
Issues = "https://github.com/filipbodor/dev-workspaces/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
